<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 16px;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #1f1e1d; color: #ececec; font-size: 14px; }
    h1 { font-size: 15px; margin: 0 0 4px; display:flex; align-items:center; gap:8px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#d97757; display:inline-block; }
    label { display:block; font-size:12px; color:#b9b6b2; margin:12px 0 4px; }
    input, select { width:100%; background:#2f2d2b; color:#ececec;
      border:1px solid #3a3836; border-radius:8px; padding:8px 10px; font:inherit; }
    button { margin-top:14px; width:100%; background:#d97757; color:#fff;
      border:none; border-radius:8px; padding:9px; font-weight:600; cursor:pointer; }
    .hint { font-size:11.5px; color:#7d7975; line-height:1.5; margin-top:8px; }
    a { color:#d97757; }
    #msg { font-size:12px; color:#8fce8f; margin-top:8px; min-height:14px; }
  </style>
</head>
<body>
  <h1><span class="dot"></span> Mini Claude</h1>
  <div class="hint">Open <b>claude.ai</b> and click the ✦ button (or press Alt+M).</div>

  <label>Anthropic API key</label>
  <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off">

  <label>Default model</label>
  <select id="model">
    <option value="claude-sonnet-5">claude-sonnet-5</option>
    <option value="claude-opus-4-8">claude-opus-4-8</option>
    <option value="claude-haiku-4-5-20251001">claude-haiku-4-5</option>
  </select>

  <button id="save">Save</button>
  <div id="msg"></div>
  <div class="hint">Your key is stored only in this browser's extension storage.
    Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>.</div>

  <script src="options.js"></script>
</body>
</html>
